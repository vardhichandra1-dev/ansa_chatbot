<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background — split scene: video call on left, companion on right -->
  <rect width="1100" height="680" fill="#111318"/>

  <!-- LEFT: Meeting platform (Teams/Meet mockup) -->
  <rect x="0" y="0" width="640" height="680" fill="#141414"/>
  <!-- Meet top bar -->
  <rect x="0" y="0" width="640" height="52" fill="#202124"/>
  <text x="24" y="33" fill="#e8eaed" font-size="15" font-weight="500">Google Meet</text>
  <rect x="540" y="14" width="80" height="26" rx="6" fill="#ea4335"/>
  <text x="580" y="31" text-anchor="middle" fill="white" font-size="12" font-weight="500">Leave</text>

  <!-- Video tiles -->
  <rect x="16" y="68" width="296" height="220" rx="10" fill="#2d2e30"/>
  <text x="164" y="168" text-anchor="middle" fill="#9aa0a6" font-size="42">👤</text>
  <rect x="16" y="296" width="88" height="20" rx="4" fill="rgba(0,0,0,0.5)"/>
  <text x="24" y="311" fill="#e8eaed" font-size="12">Interviewer (Google)</text>

  <rect x="328" y="68" width="296" height="220" rx="10" fill="#1a1a1b"/>
  <text x="476" y="168" text-anchor="middle" fill="#9aa0a6" font-size="42">👤</text>
  <rect x="328" y="296" width="60" height="20" rx="4" fill="rgba(0,0,0,0.5)"/>
  <text x="336" y="311" fill="#e8eaed" font-size="12">You</text>

  <!-- Bottom controls bar -->
  <rect x="0" y="480" width="640" height="68" fill="#202124"/>
  <text x="320" y="502" text-anchor="middle" fill="#9aa0a6" font-size="11">▼ Meet controls</text>
  <!-- Control buttons -->
  <circle cx="228" cy="523" r="22" fill="#3c4043"/>
  <text x="228" y="529" text-anchor="middle" fill="#e8eaed" font-size="14">🎤</text>
  <circle cx="292" cy="523" r="22" fill="#3c4043"/>
  <text x="292" y="529" text-anchor="middle" fill="#e8eaed" font-size="14">📷</text>
  <circle cx="356" cy="523" r="22" fill="#3c4043"/>
  <text x="356" y="529" text-anchor="middle" fill="#e8eaed" font-size="14">💬</text>
  <circle cx="420" cy="523" r="22" fill="#ea4335"/>
  <text x="420" y="529" text-anchor="middle" fill="white" font-size="14">📞</text>

  <!-- Caption area in Meet -->
  <rect x="16" y="400" width="608" height="68" rx="8" fill="rgba(0,0,0,0.6)"/>
  <text x="320" y="424" text-anchor="middle" fill="#9aa0a6" font-size="11">LIVE CAPTIONS</text>
  <text x="320" y="447" text-anchor="middle" fill="#e8eaed" font-size="14">Interviewer: How would you design a distributed caching system?</text>
  <text x="320" y="464" text-anchor="middle" fill="#e8eaed" font-size="13" opacity="0.5">You: Sure, I'd start by...</text>

  <!-- ── RIGHT: Companion App ──────────────────────────── -->
  <rect x="652" y="0" width="448" height="680" fill="#0f1117"/>

  <!-- Companion header -->
  <rect x="652" y="0" width="448" height="48" fill="#1a1d27"/>
  <rect x="652" y="47" width="448" height="1" fill="#2d3148"/>
  <text x="670" y="22" fill="#818cf8" font-size="11" font-weight="600">Copilot</text>
  <text x="714" y="22" fill="#e2e8f0" font-size="12" font-weight="500">Google · Senior SWE</text>
  <!-- LIVE badge -->
  <rect x="862" y="9" width="46" height="18" rx="5" fill="rgba(239,68,68,0.15)"/>
  <circle cx="870" cy="18" r="3.5" fill="#ef4444"/>
  <text x="877" y="22" fill="#ef4444" font-size="10" font-weight="700">LIVE</text>
  <text x="920" y="22" fill="#64748b" font-size="11">08:44</text>
  <text x="966" y="22" fill="#64748b" font-size="18" font-weight="300">⊡</text>
  <text x="994" y="22" fill="#64748b" font-size="14">✕</text>

  <!-- Question box -->
  <rect x="660" y="58" width="432" height="74" rx="8" fill="#1e2235" stroke="#6366f1" stroke-width="1"/>
  <rect x="660" y="58" width="3" height="74" rx="1" fill="#6366f1"/>
  <text x="674" y="76" fill="#818cf8" font-size="10" font-weight="700">QUESTION DETECTED</text>
  <rect x="790" y="63" width="90" height="17" rx="3" fill="rgba(99,102,241,0.15)"/>
  <text x="835" y="75" text-anchor="middle" fill="#818cf8" font-size="10">system_design</text>
  <rect x="888" y="63" width="55" height="17" rx="3" fill="rgba(245,158,11,0.12)"/>
  <text x="915" y="75" text-anchor="middle" fill="#f59e0b" font-size="10">follow-up</text>
  <text x="674" y="96" fill="#e2e8f0" font-size="13" font-weight="500">How would you design a distributed caching system?</text>
  <text x="674" y="113" fill="#475569" font-size="11" font-style="italic">↳ "How would you design a distributed caching system for a high-traffic API?"</text>
  <text x="1060" y="126" fill="#64748b" font-size="10" text-anchor="end">Q3</text>

  <!-- Guidance panel -->
  <rect x="660" y="142" width="432" height="290" rx="8" fill="#1a1d27" stroke="#2d3148" stroke-width="1"/>
  <!-- Guidance header -->
  <rect x="660" y="142" width="432" height="30" rx="8" fill="#1e2235"/>
  <rect x="660" y="158" width="432" height="14" fill="#1e2235"/>
  <text x="676" y="161" fill="#94a3b8" font-size="11" font-weight="600">AI Guidance</text>
  <circle cx="760" cy="157" r="4" fill="#22c55e"/>
  <text x="768" y="161" fill="#22c55e" font-size="10">Streaming</text>
  <text x="1072" y="161" fill="#64748b" font-size="10" text-anchor="end">⎘ Copy</text>

  <!-- Guidance content -->
  <text x="676" y="195" fill="#818cf8" font-size="12" font-weight="700">Key points:</text>
  <text x="684" y="213" fill="#94a3b8" font-size="12">•  Redis Cluster vs Memcached — Redis wins for rich data types</text>
  <text x="684" y="230" fill="#94a3b8" font-size="12">•  Consistent hashing for horizontal sharding (avoid hotspots)</text>
  <text x="684" y="247" fill="#94a3b8" font-size="12">•  TTL + event-driven invalidation for consistency</text>
  <text x="684" y="264" fill="#94a3b8" font-size="12">•  Cache stampede protection: probabilistic early expiry or locks</text>

  <text x="676" y="288" fill="#818cf8" font-size="12" font-weight="700">From your experience:</text>
  <text x="684" y="306" fill="#94a3b8" font-size="12">•  Redis session store handling 10k RPS in your previous project</text>
  <text x="684" y="323" fill="#94a3b8" font-size="12">•  Trade-offs: eventual consistency vs. stale reads at scale</text>

  <text x="676" y="347" fill="#818cf8" font-size="12" font-weight="700">Framework: Technical Steps</text>
  <text x="684" y="365" fill="#94a3b8" font-size="12">1.  Identify cache scope (L1 local / L2 distributed / CDN edge)</text>
  <text x="684" y="382" fill="#94a3b8" font-size="12">2.  Choose invalidation strategy based on consistency SLA</text>

  <!-- Blinking cursor -->
  <rect x="684" y="393" width="6" height="12" rx="1" fill="#6366f1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- Transcript drawer (collapsed) -->
  <rect x="660" y="442" width="432" height="36" rx="8" fill="#1a1d27" stroke="#2d3148" stroke-width="1"/>
  <text x="676" y="464" fill="#64748b" font-size="12">▶  Transcript  </text>
  <text x="756" y="464" fill="#475569" font-size="11">12 segments</text>

  <!-- Manual question input -->
  <rect x="660" y="488" width="360" height="36" rx="7" fill="#151822" stroke="#2d3148" stroke-width="1"/>
  <text x="676" y="511" fill="#475569" font-size="12">Type a question manually…</text>
  <rect x="1026" y="488" width="66" height="36" rx="7" fill="#6366f1"/>
  <text x="1059" y="511" text-anchor="middle" fill="white" font-size="12" font-weight="600">Send →</text>

  <!-- Status bar -->
  <rect x="652" y="534" width="448" height="40" fill="#1a1d27"/>
  <rect x="652" y="534" width="448" height="1" fill="#2d3148"/>
  <!-- Audio waveform indicator -->
  <g fill="#6366f1" opacity="0.7">
    <rect x="668" y="546" width="3" height="6"  rx="1"/>
    <rect x="674" y="543" width="3" height="12" rx="1"/>
    <rect x="680" y="547" width="3" height="5"  rx="1"/>
    <rect x="686" y="541" width="3" height="14" rx="1"/>
    <rect x="692" y="545" width="3" height="8"  rx="1"/>
  </g>
  <text x="706" y="558" fill="#94a3b8" font-size="11">Listening — meeting audio active</text>
  <rect x="958" y="540" width="54" height="24" rx="5" fill="transparent" stroke="#2d3148" stroke-width="1"/>
  <text x="985" y="556" text-anchor="middle" fill="#94a3b8" font-size="11">⏸ Pause</text>
  <rect x="1018" y="540" width="70" height="24" rx="5" fill="transparent" stroke="#2d3148" stroke-width="1"/>
  <text x="1053" y="556" text-anchor="middle" fill="#94a3b8" font-size="11">■ End</text>

  <!-- SETUP SCREEN (shown below, smaller) -->
  <rect x="652" y="580" width="448" height="100" rx="0" fill="#0f1117"/>
  <rect x="660" y="588" width="432" height="80" rx="8" fill="#1a1d27" stroke="#2d3148" stroke-width="1"/>
  <!-- Setup hint -->
  <text x="876" y="610" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">SETUP — open http://localhost:8000/companion</text>
  <text x="876" y="630" text-anchor="middle" fill="#475569" font-size="11">Select audio source → Meeting Audio (system) → Start Session</text>
  <text x="876" y="648" text-anchor="middle" fill="#475569" font-size="11">Pin window next to your video call for live guidance</text>

  <!-- Arrow pointing from Meet to Companion -->
  <line x1="640" y1="180" x2="660" y2="180" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="648" y="175" fill="#6366f1" font-size="9" text-anchor="middle">audio</text>
</svg>
