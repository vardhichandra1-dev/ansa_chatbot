  <rect x="592" y="562" width="380" height="44" rx="8" fill="#151822" stroke="#2d3148" stroke-width="1"/>
  <text x="612" y="588" fill="#475569" font-size="13">Company name (e.g., Google)</text>
  <rect x="980" y="562" width="192" height="44" rx="8" fill="#6366f1"/>
  <text x="1076" y="588" text-anchor="middle" fill="white" font-size="13" font-weight="600">Generate Prep Plan</text>

