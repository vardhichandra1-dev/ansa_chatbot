  <text x="852" y="439" text-anchor="middle" fill="#94a3b8" font-size="11">RAG</text>
  <text x="924" y="439" text-anchor="middle" fill="#94a3b8" font-size="11">FastAPI</text>
  <text x="1012" y="439" text-anchor="middle" fill="#94a3b8" font-size="11">LangChain</text>
  <text x="626" y="473" text-anchor="middle" fill="#94a3b8" font-size="11">Docker</text>
  <text x="696" y="473" text-anchor="middle" fill="#94a3b8" font-size="11">Redis</text>
  <text x="771" y="473" text-anchor="middle" fill="#94a3b8" font-size="11">PostgreSQL</text>
