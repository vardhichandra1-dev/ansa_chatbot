  <text x="520" y="33" fill="#94a3b8" font-size="13">Live Interview</text>
  <text x="625" y="33" fill="#94a3b8" font-size="13">Mock Interview</text>
  <text x="740" y="33" fill="#94a3b8" font-size="13">Analytics</text>
