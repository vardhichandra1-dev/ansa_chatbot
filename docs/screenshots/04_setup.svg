  <text x="750" y="662" fill="#4ade80" font-size="11">sk-ant-••••••••••••6Xzw  ✓</text>
  <text x="612" y="680" fill="#64748b" font-size="11">OPENAI_API_KEY</text>
  <text x="750" y="680" fill="#4ade80" font-size="11">sk-proj-••••••••••••9kRt  ✓</text>
