    <rect x="756" y="422" width="60" height="26" rx="5"/>
    <rect x="824" y="422" width="56" height="26" rx="5"/>
    <rect x="888" y="422" width="72" height="26" rx="5"/>
    <rect x="968" y="422" width="88" height="26" rx="5"/>
    <rect x="592" y="456" width="68" height="26" rx="5"/>
    <rect x="668" y="456" width="56" height="26" rx="5"/>
    <rect x="732" y="456" width="78" height="26" rx="5"/>
    <rect x="818" y="456" width="74" height="26" rx="5"/>
    <rect x="900" y="456" width="100" height="26" rx="5"/>
    <rect x="592" y="490" width="68" height="26" rx="5"/>
